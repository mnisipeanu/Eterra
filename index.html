<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Skills Matrix</title>
<style>
:root{--blue:#2563eb;--dark:#172033;--muted:#64748b;--border:#dbe3ef;--bg:#f4f7fb;--red:#dc2626;--green:#15803d}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--dark)}header{padding:26px max(20px,calc((100vw - 1500px)/2));background:linear-gradient(135deg,#123a76,#2563eb);color:#fff}header h1{margin:0 0 5px}header p{margin:0;opacity:.88}main{max-width:1500px;margin:22px auto;padding:0 20px 40px}.panel{background:#fff;border:1px solid var(--border);border-radius:15px;box-shadow:0 10px 28px rgba(24,39,75,.07)}.toolbar{padding:14px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:15px}button{border:0;border-radius:9px;padding:9px 13px;font-weight:650;cursor:pointer;font-size:14px}.primary{background:var(--blue);color:#fff}.secondary{background:#edf3ff;color:#1749a0}.danger{background:#feecec;color:#a81010}.ghost{background:transparent;color:#35506f;padding:5px 7px}.search{margin-left:auto;min-width:240px;border:1px solid #cbd6e5;border-radius:9px;padding:9px 11px}.tabs{display:flex;gap:7px;margin-bottom:15px}.tab{background:#e8edf5;color:#40516a}.tab.active{background:var(--dark);color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:15px}.stat{padding:15px}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:24px;margin-top:3px}.head{padding:15px 17px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:center}.head h2{margin:0;font-size:18px}.legend{font-size:12px;color:var(--muted)}.tableWrap{overflow:auto;max-height:67vh}table{width:100%;border-collapse:separate;border-spacing:0;min-width:850px}th,td{padding:10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);text-align:center;background:#fff}thead th{position:sticky;top:0;z-index:3;background:#eef4fd;font-size:12px}th:first-child,td:first-child{position:sticky;left:0;z-index:2;min-width:190px;text-align:left;box-shadow:2px 0 #dbe3ef}thead th:first-child{z-index:4;background:#e7f0fd}.member{display:flex;justify-content:space-between;align-items:center;gap:7px}.skillHead{display:flex;flex-direction:column;gap:5px;align-items:center}.skillActions{display:flex;gap:2px}.stars{display:flex;justify-content:center;white-space:nowrap}.star{border:0;background:transparent;padding:1px;font-size:23px;color:#cbd5e1;cursor:pointer;line-height:1}.star.on{color:#f5b301}.clearStar{font-size:11px;color:#64748b;background:transparent;padding:3px}.coverage{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.coverageCard{border:1px solid var(--border);border-radius:12px;padding:14px}.coverageCard h3{margin:0 0 10px}.person{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #edf0f5}.badge{border-radius:20px;padding:3px 8px;font-size:12px;font-weight:700}.good{background:#dcfce7;color:#166534}.risk{background:#fee2e2;color:#991b1b}.none,.empty{color:var(--muted)}.empty{padding:38px;text-align:center}dialog{border:0;border-radius:15px;padding:0;width:min(430px,calc(100vw - 28px));box-shadow:0 20px 60px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(10,20,40,.5)}.modal{padding:21px}.modal h3{margin:0 0 8px}.modal p{margin:0 0 15px;color:var(--muted)}.modal input{width:100%;border:1px solid #cbd6e5;border-radius:9px;padding:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:11px 15px;border-radius:9px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.search{width:100%;margin-left:0}.legend{display:none}}
</style>
</head><body>
<header><h1>Team Skills Matrix</h1><p>Track team capabilities, support coverage and knowledge risks.</p></header>
<main><section class="panel toolbar"><button class="primary" id="addMember">+ Add member</button><button class="primary" id="addSkill">+ Add skill</button><button class="secondary" id="saveFile">Save JSON</button><button class="secondary" id="exportCsv">Export CSV</button><button class="danger" id="reset">Reset</button><input class="search" id="search" placeholder="Filter members or skills (minimum 3 characters)..."></section>
<div class="tabs"><button class="tab active" data-view="matrix">Skills matrix</button><button class="tab" data-view="coverage">Who can support?</button></div>
<section class="stats"><div class="panel stat"><span>Team members</span><b id="memberCount">0</b></div><div class="panel stat"><span>Skills</span><b id="skillCount">0</b></div><div class="panel stat"><span>Average level</span><b id="average">0.0</b></div><div class="panel stat"><span>Coverage risks</span><b id="risks">0</b></div></section>
<section class="panel"><div class="head"><h2 id="viewTitle">Skills matrix</h2><div class="legend">1 Basic · 2 Working · 3 Independent · 4 Advanced · 5 Expert</div></div><div id="content"><div class="empty">Loading matrix-data.json…</div></div></section></main>
<dialog id="editDialog"><form class="modal" id="editForm"><h3 id="editTitle"></h3><p id="editHelp"></p><input id="editInput" maxlength="80" required autocomplete="off"><div class="actions"><button type="button" class="secondary" id="editCancel">Cancel</button><button type="submit" class="primary">Save</button></div></form></dialog>
<dialog id="confirmDialog"><div class="modal"><h3 id="confirmTitle">Confirm</h3><p id="confirmText"></p><div class="actions"><button type="button" class="secondary" id="confirmCancel">Cancel</button><button type="button" class="danger" id="confirmOk">Delete</button></div></div></dialog><div class="toast" id="toast"></div>
<script>
'use strict';
const DATA_URL='matrix-data.json',CACHE_KEY='teamSkillsMatrix.deploy.v1';
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const $=s=>document.querySelector(s),escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data={members:[],skills:[],ratings:{}},initialData=null,view='matrix',editAction=null,confirmAction=null;
const valid=d=>d&&Array.isArray(d.members)&&Array.isArray(d.skills)&&d.ratings&&typeof d.ratings==='object';
function notify(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
async function initialise(){try{const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const fileData=await r.json();if(!valid(fileData))throw new Error('Invalid data');initialData=structuredClone(fileData);const cached=localStorage.getItem(CACHE_KEY);data=cached&&valid(JSON.parse(cached))?JSON.parse(cached):fileData;render()}catch(e){$('#content').innerHTML='<div class="empty"><strong>Could not load matrix-data.json.</strong><br>Deploy both files in the same folder and open via GitHub Pages or another web server.</div>';console.error(e)}}
function persist(){localStorage.setItem(CACHE_KEY,JSON.stringify(data));render()}
function rating(mid,sid){return Number(data.ratings[mid+'|'+sid]||0)}
function setRating(mid,sid,n){data.ratings[mid+'|'+sid]=Number(n);persist()}
function promptEdit(title,help,value,action){$('#editTitle').textContent=title;$('#editHelp').textContent=help;$('#editInput').value=value||'';editAction=action;$('#editDialog').showModal();setTimeout(()=>$('#editInput').focus(),20)}
$('#editForm').addEventListener('submit',e=>{e.preventDefault();const v=$('#editInput').value.trim();if(!v)return;editAction(v);$('#editDialog').close()});$('#editCancel').onclick=()=>$('#editDialog').close();
function confirmDo(title,text,action){$('#confirmTitle').textContent=title;$('#confirmText').textContent=text;confirmAction=action;$('#confirmDialog').showModal()}
$('#confirmCancel').onclick=()=>$('#confirmDialog').close();$('#confirmOk').onclick=()=>{if(confirmAction)confirmAction();$('#confirmDialog').close()};
function addMember(){promptEdit('Add team member','Enter the team member name.','',name=>{if(data.members.some(x=>x.name.toLowerCase()===name.toLowerCase()))return notify('Member already exists');data.members.push({id:uid(),name});persist();notify('Member added')})}
function addSkill(){promptEdit('Add skill','Enter the new skill name.','',name=>{if(data.skills.some(x=>x.name.toLowerCase()===name.toLowerCase()))return notify('Skill already exists');data.skills.push({id:uid(),name});persist();notify('Skill added')})}
function renameMember(id){const x=data.members.find(x=>x.id===id);promptEdit('Rename member','Ratings will be preserved.',x.name,name=>{x.name=name;persist()})}
function renameSkill(id){const x=data.skills.find(x=>x.id===id);promptEdit('Rename skill','Ratings will be preserved.',x.name,name=>{x.name=name;persist()})}
function deleteMember(id){const x=data.members.find(x=>x.id===id);confirmDo('Delete member','Delete '+x.name+' and all ratings?',()=>{data.members=data.members.filter(y=>y.id!==id);Object.keys(data.ratings).filter(k=>k.startsWith(id+'|')).forEach(k=>delete data.ratings[k]);persist()})}
function deleteSkill(id){const x=data.skills.find(x=>x.id===id);confirmDo('Delete skill','Delete '+x.name+' and all ratings?',()=>{data.skills=data.skills.filter(y=>y.id!==id);Object.keys(data.ratings).filter(k=>k.endsWith('|'+id)).forEach(k=>delete data.ratings[k]);persist()})}
function stars(m,s){const v=rating(m.id,s.id);return '<div class="stars" title="'+v+' of 5">'+[1,2,3,4,5].map(n=>'<button class="star '+(n<=v?'on':'')+'" onclick="setRating(\''+m.id+'\',\''+s.id+'\','+n+')">★</button>').join('')+'<button class="clearStar" onclick="setRating(\''+m.id+'\',\''+s.id+'\',0)" title="Clear rating">×</button></div>'}
function query(){const q=$('#search').value.trim();return q.length>=3?q.toLowerCase():''}
function renderMatrix(){const q=query();let ms=data.members,ss=data.skills;if(q){ms=ms.filter(m=>m.name.toLowerCase().includes(q));ss=ss.filter(s=>s.name.toLowerCase().includes(q));if(!ms.length&&ss.length)ms=data.members;if(!ss.length&&ms.length)ss=data.skills}if(!ms.length||!ss.length)return '<div class="empty">No matching data.</div>';return '<div class="tableWrap"><table><thead><tr><th>Team member</th>'+ss.map(s=>'<th><div class="skillHead"><span>'+escapeHtml(s.name)+'</span><div class="skillActions"><button class="ghost" title="Rename" onclick="renameSkill(\''+s.id+'\')">✎</button><button class="ghost" title="Delete" onclick="deleteSkill(\''+s.id+'\')">×</button></div></div></th>').join('')+'</tr></thead><tbody>'+ms.map(m=>'<tr><td><div class="member"><strong>'+escapeHtml(m.name)+'</strong><span><button class="ghost" onclick="renameMember(\''+m.id+'\')">✎</button><button class="ghost" onclick="deleteMember(\''+m.id+'\')">×</button></span></div></td>'+ss.map(s=>'<td>'+stars(m,s)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function renderCoverage(){const q=query();const ss=data.skills.filter(s=>!q||s.name.toLowerCase().includes(q)||data.members.some(m=>m.name.toLowerCase().includes(q)&&rating(m.id,s.id)>0));return '<div class="coverage">'+ss.map(s=>{const people=data.members.map(m=>({name:m.name,v:rating(m.id,s.id)})).filter(x=>x.v>=3).sort((a,b)=>b.v-a.v||a.name.localeCompare(b.name));const risk=people.length<2;return '<article class="coverageCard"><div style="display:flex;justify-content:space-between;gap:8px"><h3>'+escapeHtml(s.name)+'</h3><span class="badge '+(risk?'risk':'good')+'">'+(risk?'Coverage risk':'Covered')+'</span></div>'+(people.length?people.map(p=>'<div class="person"><span>'+escapeHtml(p.name)+'</span><span>'+'★'.repeat(p.v)+'☆'.repeat(5-p.v)+'</span></div>').join(''):'<div class="none">No member rated Independent or higher.</div>')+'</article>'}).join('')+'</div>'}
function render(){const vals=Object.values(data.ratings).map(Number).filter(x=>x>0),risks=data.skills.filter(s=>data.members.filter(m=>rating(m.id,s.id)>=3).length<2).length;$('#memberCount').textContent=data.members.length;$('#skillCount').textContent=data.skills.length;$('#average').textContent=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):'0.0';$('#risks').textContent=risks;$('#viewTitle').textContent=view==='matrix'?'Skills matrix':'Who can support each skill?';$('#content').innerHTML=view==='matrix'?renderMatrix():renderCoverage();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===view))}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('#addMember').onclick=addMember;$('#addSkill').onclick=addSkill;$('#search').oninput=()=>{const q=$('#search').value.trim();if(!q||q.length>=3)render()};document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{view=x.dataset.view;render()});
$('#saveFile').onclick=()=>{download('matrix-data.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');notify('matrix-data.json downloaded')};
$('#exportCsv').onclick=()=>{const q=x=>'"'+String(x).replaceAll('"','""')+'"',rows=[['Team member',...data.skills.map(s=>s.name)],...data.members.map(m=>[m.name,...data.skills.map(s=>rating(m.id,s.id))])];download('team-skills-matrix.csv','\ufeff'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv;charset=utf-8')};
$('#reset').onclick=()=>confirmDo('Reset matrix','Restore matrix-data.json and clear browser changes?',()=>{data=structuredClone(initialData);localStorage.removeItem(CACHE_KEY);render();notify('Matrix reset')});
initialise();
</script></body></html>
